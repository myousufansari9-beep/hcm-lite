<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCM Lite | Login</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Main container -->
    <main class="auth-container">
      <!-- Section 1: First-time Company Setup -->
      <section id="setup-section" class="auth-section">
        <h1>Welcome to HCM Lite</h1>
        <p>Set up your company and Admin account.</p>

        <form id="setup-form">
          <div class="form-group">
            <label for="company-name">Company Name</label>
            <input type="text" id="company-name" name="companyName" required />
          </div>

          <div class="form-group">
            <label for="admin-name">Admin Name</label>
            <input type="text" id="admin-name" name="adminName" required />
          </div>

          <div class="form-group">
            <label for="admin-email">Admin Email</label>
            <input type="email" id="admin-email" name="adminEmail" required />
          </div>

          <div class="form-group">
            <label for="admin-password">Password</label>
            <input
              type="password"
              id="admin-password"
              name="adminPassword"
              required
            />
          </div>

          <p id="setup-error" role="alert"></p>

          <button type="submit">Set Up Company</button>
        </form>
      </section>

      <!-- Section 2: Login -->
      <section id="login-section" class="auth-section" hidden>
        <h1>Welcome Back</h1>
        <p>Log in to your HCM Lite account.</p>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" required />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              required
            />
          </div>

          <p id="login-error" role="alert"></p>

          <button type="submit">Login</button>
        </form>
      </section>
    </main>

    <!-- JavaScript files -->
    <script src="js/storage.js" defer></script>
    <script src="js/auth.js" defer></script>
  </body>
</html>
